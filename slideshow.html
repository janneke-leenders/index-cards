<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Index cards</title>
<style>
  :root { --bg: #efece6; --ink: #4a5566; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; font-family: Arial, sans-serif; color: var(--ink); }
  .stage { perspective: 1600px; }
  .card { width: min(55vh, 80vw); aspect-ratio: 55 / 85; position: relative; transform-style: preserve-3d;
          transition: transform 1.1s cubic-bezier(.45, .05, .25, 1), opacity .7s ease; }
  .card.flip { transform: rotateY(180deg); }
  .card.gone { opacity: 0; transform: rotateY(180deg) translateY(-30px); }
  .card.enter { opacity: 0; transform: translateY(30px); }
  .face { position: absolute; inset: 0; backface-visibility: hidden; background: #fff center / cover no-repeat;
          box-shadow: 0 10px 30px rgba(0, 0, 0, .18); }
  .back { transform: rotateY(180deg); }
  .count { position: fixed; bottom: 16px; right: 20px; font-size: 13px; opacity: .6; }
  .hint { position: fixed; bottom: 16px; left: 20px; font-size: 13px; opacity: .6; }
</style>
</head>
<body>
<div class="stage"><div class="card enter" id="card"><div class="face front" id="f"></div><div class="face back" id="b"></div></div></div>
<div class="hint">space: pause · ← →: previous / next</div>
<div class="count" id="count"></div>
<script>
  const N = 234, HOLD_FRONT = 2200, HOLD_BACK = 3200;
  const pad = n => String(n).padStart(3, "0");
  const card = document.getElementById("card"), f = document.getElementById("f"), b = document.getElementById("b");
  let i = 1, paused = false, timers = [];
  const later = (fn, ms) => timers.push(setTimeout(fn, ms));
  function show(n) {
    timers.forEach(clearTimeout); timers = [];
    i = ((n - 1 + N) % N) + 1;
    card.className = "card enter";
    f.style.backgroundImage = `url(img/${pad(i)}f.jpg)`;
    b.style.backgroundImage = `url(img/${pad(i)}b.jpg)`;
    document.getElementById("count").textContent = `${i} / ${N}`;
    new Image().src = `img/${pad(i % N + 1)}f.jpg`;
    later(() => card.className = "card", 60);
    if (paused) return;
    later(() => card.className = "card flip", 60 + HOLD_FRONT);
    later(() => card.className = "card gone", 60 + HOLD_FRONT + 1100 + HOLD_BACK);
    later(() => show(i + 1), 60 + HOLD_FRONT + 1100 + HOLD_BACK + 700);
  }
  document.addEventListener("keydown", e => {
    if (e.key === " ") { paused = !paused; paused ? (timers.forEach(clearTimeout), timers = []) : show(i); }
    if (e.key === "ArrowRight") show(i + 1);
    if (e.key === "ArrowLeft") show(i - 1);
  });
  card.addEventListener("click", () => card.classList.toggle("flip"));
  show(1);
</script>
</body>
</html>
